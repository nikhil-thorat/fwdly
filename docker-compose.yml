networks:
  fwdly-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: fwdly-postgres
    environment:
      POSTGRES_USER: fwdly_user
      POSTGRES_PASSWORD: fwdly_password
      POSTGRES_DB: fwdly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    networks:
      - fwdly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fwdly_user -d fwdly_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: fwdly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fwdly-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: fwdly-kafka
    user: root
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CLUSTER_ID: '4L62xDScTLiY2eG_A9aA4w'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - fwdly-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9092 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  management-service:
    build:
      context: .
      dockerfile: services/management/Dockerfile
    container_name: fwdly-management
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      APP_ENV: "development"
      LOG_LEVEL: "debug"
      DATABASE_URL: "postgres://fwdly_user:fwdly_password@postgres:5432/fwdly_db?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "fwdly-development-secret-key-32-bytes"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URL: "http://localhost:3000/api/auth/callback/google"
    networks:
      - fwdly-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redirect-service:
    build:
      context: .
      dockerfile: services/redirect/Dockerfile
    container_name: fwdly-redirect
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      APP_ENV: "development"
      LOG_LEVEL: "debug"
      DATABASE_URL: "postgres://fwdly_user:fwdly_password@postgres:5432/fwdly_db?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKER: "kafka:29092"
    networks:
      - fwdly-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  analytics-consumer:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    container_name: fwdly-analytics
    environment:
      APP_ENV: "development"
      LOG_LEVEL: "debug"
      DATABASE_URL: "postgres://fwdly_user:fwdly_password@postgres:5432/fwdly_db?sslmode=disable"
      KAFKA_BROKER: "kafka:29092"
    networks:
      - fwdly-network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: fwdly-api-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      APP_ENV: "development"
      LOG_LEVEL: "debug"
      MANAGEMENT_SERVICE_URL: "http://management-service:8081"
      REDIRECT_SERVICE_URL: "http://redirect-service:8080"
    networks:
      - fwdly-network
    depends_on:
      - management-service
      - redirect-service
